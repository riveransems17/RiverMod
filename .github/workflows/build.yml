name: Build Geode Mod

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    name: Build Mod
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        id: build

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: ${{ steps.build.outputs.build-output }}
